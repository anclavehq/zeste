name: Release

# While changesets are pending on main, keeps a "Release" pull request open with the version bump and changelogs.
# Merging it publishes to npm. Needs npm trusted publishing set up for every package (see RELEASING.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request opened with GITHUB_TOKEN would not trigger the CI workflow.
          token: ${{ secrets.CATALOG_UPDATE_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Open or update the release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: Release
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_UPDATE_TOKEN }}
      - name: Check whether this version is on npm
        id: npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@zeste/core@$version" version | grep -q .; then
            echo "$version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.changesets.outputs.hasChangesets == 'false' && !steps.npm.outputs.published
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm release
          git tag "v$VERSION" && git push origin "v$VERSION"
