name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      - 'examples/playground/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site build
        env:
          # GitHub Pages serves the repository under /zeste; with a custom domain, set BASE_PATH to /.
          SITE_URL: https://anclavehq.github.io
          BASE_PATH: /zeste
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
