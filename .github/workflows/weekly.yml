name: Weekly

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e exec vite build harness --outDir ../dist --emptyOutDir
      - run: pnpm --filter e2e exec playwright test --project=real-network
        env:
          ZESTE_REAL_NETWORK: '1'
          ZESTE_HARNESS_ONLY: '1'

  tarteaucitron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for a new tarteaucitron.js release
        id: version
        run: |
          current=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packages/services/package.json | jq -r .devDependencies.tarteaucitronjs)
          latest=$(npm view tarteaucitronjs version)
          echo "pinned $current, latest $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=chore/tarteaucitron-$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.version.outputs.current != steps.version.outputs.latest
        with:
          # A pull request opened with GITHUB_TOKEN would not trigger the CI workflow.
          token: ${{ secrets.CATALOG_UPDATE_TOKEN }}
      - name: Skip if a pull request already exists
        id: existing
        if: steps.version.outputs.current != steps.version.outputs.latest
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "branch $BRANCH already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.version.outputs.current != steps.version.outputs.latest && !steps.existing.outputs.skip
      - uses: actions/setup-node@v7
        if: steps.version.outputs.current != steps.version.outputs.latest && !steps.existing.outputs.skip
        with:
          node-version: 24
          cache: pnpm
      - name: Update the catalog and open a pull request
        if: steps.version.outputs.current != steps.version.outputs.latest && !steps.existing.outputs.skip
        env:
          GH_TOKEN: ${{ secrets.CATALOG_UPDATE_TOKEN }}
          CURRENT: ${{ steps.version.outputs.current }}
          LATEST: ${{ steps.version.outputs.latest }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          cp packages/services/src/catalog.ts "$RUNNER_TEMP/catalog.ts"
          sed -i "s/\"tarteaucitronjs\": \"$CURRENT\"/\"tarteaucitronjs\": \"$LATEST\"/" packages/core/package.json packages/services/package.json
          pnpm install --no-frozen-lockfile
          pnpm --filter @zeste/services generate | tee "$RUNNER_TEMP/generate.txt"
          (cd packages/services && node scripts/catalog-diff.ts "$RUNNER_TEMP/catalog.ts") > "$RUNNER_TEMP/summary.md"

          bump=patch
          grep -q '^### \(Consent\|Added\|Removed\)' "$RUNNER_TEMP/summary.md" && bump=minor
          printf -- "---\n'@zeste/services': %s\n---\n\nCatalog generated from tarteaucitron.js %s.\n" "$bump" "$LATEST" \
            > ".changeset/tarteaucitron-${LATEST//./-}.md"

          code=$(git diff --name-only -I '^// Generated by scripts/generate.ts' -- packages/services/src/impl packages/services/src/services)
          code="$code"$'\n'"$(git ls-files --others --exclude-standard -- packages/services/src/impl packages/services/src/services)"
          {
            echo "tarteaucitron.js $LATEST is out (the catalog was generated from $CURRENT). Opened by the weekly workflow."
            echo
            echo "Check the consent behaviour changes before merging, and edit the changeset if needed. Changelog: https://github.com/AmauriC/tarteaucitron.js/releases"
            echo
            echo "## Catalog"
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "## Service code changed beyond the version header"
            echo
            echo "$code" | sed '/^$/d; s/.*/- `&`/'
            echo
            echo "## Generator output"
            echo
            echo '```'
            cat "$RUNNER_TEMP/generate.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore(services): update the catalog to tarteaucitron.js $LATEST"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Update the catalog to tarteaucitron.js $LATEST" --body-file "$RUNNER_TEMP/body.md"
